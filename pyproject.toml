[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transmute"
version = "0.1.0"
description = "Database migrations: Alembic autogenerate power, Laravel linear simplicity"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Timur Moiseenko", email = "" }
]
keywords = ["database", "migrations", "sqlalchemy", "schema", "alembic", "laravel"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "sqlalchemy>=2.0",
    "click>=8.0",
    "jinja2>=3.0",
]

[project.urls]
Homepage = "https://github.com/Tmoiseenko/transmute"
Repository = "https://github.com/Tmoiseenko/transmute"
Issues = "https://github.com/Tmoiseenko/transmute/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
transmute = "transmute.cli.main:cli"

[tool.setuptools.packages.find]
include = ["transmute*"]

[tool.setuptools.package-data]
transmute = ["templates/*.j2"]


